d:#a48ace}.spark{position:absolute;right:18%;top:19%;font-size:43px;color:#779546}.details{display:flex;flex-direction:column;justify-content:center;padding:40px}.badge{align-self:flex-start;background:#dfe8ce;border-radius:20px;padding:8px 12px;font-size:10px;letter-spacing:1px;text-transform:uppercase}h3{font-size:33px;letter-spacing:-1.4px;margin:21px 0 12px}.details p{font-size:15px;color:var(--muted);line-height:1.7;margin:0;max-width:270px}.release-note{margin-top:29px;font:10px monospace;letter-spacing:.7px;color:#727969}footer{display:flex;justify-content:space-between;align-items:center;gap:18px;border-top:1px solid #dadcd1;padding:25px 0 35px;color:var(--muted);font-size:11px}footer a{text-decoration:none;margin-left:22px}footer a:hover{text-decoration:underline}@media(max-width:650px){.wrap{padding:0 22px}header{height:82px}.brand{font-size:21px}.intro{padding:49px 0 38px}h1{font-size:49px;letter-spacing:-2.5px}.release{grid-template-columns:1fr}.art{min-height:270px}.details{padding:29px}.games{padding-bottom:44px}footer{align-items:start;flex-direction:column}footer a{margin-left:0;margin-right:22px}}
